# Define a group of backend servers (upstream) for load balancing
# This is the port inside the container, i.e., the port that Uvicorn server is listening on.
# All three containers are listening on port 8000 internally.
upstream app {
    server app1:8000;   # First Uvicorn container (service name in Docker Compose)
    server app2:8000;   # Second Uvicorn container
    server app3:8000;   # Third Uvicorn container
}

# Define an HTTP server
server {
    listen 80;           # Listen on port 80 (default HTTP port)
    server_name _;       # Catch-all server name (matches any request)

    # Define how to handle requests to this server
    location / {
        proxy_pass http://app;  # Forward all requests to the "app" upstream (load balancing)
    }
}

# upstream app : Creates a logical name app that points to multiple backend servers.

# Nginx will load balance requests across app1, app2, and app3 using the default round-robin method.

# server block : Handles incoming HTTP requests on port 80.

# server_name _; acts as a wildcard, catching all hostnames.

# location / : Matches all URLs (/).

# proxy_pass http://app; sends the request to the upstream group app.